<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }
        #healthBar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        #healthFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #ff0000, #00ff00);
            transition: width 0.3s;
        }
        #ammo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 0 0 5px black;
        }
        #waveDisplay {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 0 0 5px black;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            pointer-events: all;
        }
        #menu button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 18px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #menu button:hover {
            background: #666;
        }
        #toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 70%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div id="crosshair"></div>
            <div id="healthBar">
                <div id="healthFill"></div>
            </div>
            <div id="ammo">Ammo: 30/90</div>
            <div id="waveDisplay">Wave: 1</div>
            <div id="toast"></div>
            <div id="vignette"></div>
            <div id="menu">
                <h1>3D FPS GAME</h1>
                <p>Use WASD to move, mouse to look around</p>
                <p>Left-click to shoot, shift to run</p>
                <button id="startButton">START GAME</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/PointerLockControls.js"></script>
    
    <script>
        // Engine Core Module
        window.EngineCore = (function() {
            let scene, camera, renderer, controls;
            let player, bullets = [];
            let raycaster = new THREE.Raycaster();
            let clock = new THREE.Clock();
            let frameCallbacks = [];
            let colliders = [];
            let bulletHoleSpawner = null;
            let arena = {
                levels: [0, 1, 2],
                spawnPoint: function(level) {
                    const positions = [
                        new THREE.Vector3(0, 1, 0),
                        new THREE.Vector3(15, 1, 0),
                        new THREE.Vector3(0, 1, 15)
                    ];
                    return positions[level] || positions[0];
                }
            };
            let pickupHandlers = {};
            let gameState = { health: 100, isSliding: false, speed: 0 };

            // Initialize scene
            function init(container, opts = {}) {
                // Scene setup
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x808080);
                scene.fog = new THREE.Fog(0x808080, 20, 100);

                // Camera setup
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1, 0);

                // Renderer setup
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                container.appendChild(renderer.domElement);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 20, 10);
                directionalLight.castShadow = true;
                scene.add(directionalLight);

                // Setup event listeners
                window.addEventListener('resize', onWindowResize);
                document.addEventListener('click', () => {
                    if (document.pointerLockElement !== renderer.domElement) {
                        renderer.domElement.requestPointerLock();
                    }
                });

                // Controls
                controls = new THREE.PointerLockControls(camera, renderer.domElement);
                scene.add(controls.getObject());

                // Player initialization
                player = new THREE.Object3D();
                player.position.set(0, 1, 0);
                scene.add(player);

                // Bullet hole spawner
                bulletHoleSpawner = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.1, 0.1),
                    new THREE.MeshBasicMaterial({ 
                        color: 0x000000,
                        side: THREE.DoubleSide
                    })
                );
                bulletHoleSpawner.rotation.x = -Math.PI / 2;
                bulletHoleSpawner.visible = false;
                scene.add(bulletHoleSpawner);

                // Start animation loop
                animate();
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                
                // Update colliders
                colliders.forEach(collider => {
                    const obj = collider.object;
                    if (obj.userData.shouldMove) {
                        obj.position.add(obj.userData.velocity);
                        // Simple gravity
                        if (obj.position.y <= 0) {
                            obj.position.y = 0;
                            if (obj.userData.velocity) obj.userData.velocity.y = 0;
                        } else {
                            obj.userData.velocity.y -= 0.02;
                        }
                    }
                });

                // Run frame callbacks
                frameCallbacks.forEach(cb => cb(delta));
                
                renderer.render(scene, camera);
            }

            function raycast(origin, direction, maxDistance) {
                // start from the camera's actual world position, not a stale object
                const cam = camera;
                const startPos = cam.position.clone();
                const dir = new THREE.Vector3(); dir.set(0, 0, -1).applyQuaternion(cam.quaternion);
                raycaster.set(startPos, dir);
                raycaster.far = maxDistance || 100;
                const intersects = raycaster.intersectObjects(scene.children, true);

                // skip invisible helpers, the bullet-hole plane, and anything not an enemy
                const target = intersects.find(intersect => {
                    const u = intersect.object.userData;
                    return u && u.enemyId && intersect.object.visible;
                });

                if (!target) return null;

                return {
                    point: target.point,
                    mesh: target.object,
                    enemyId: target.object.userData.enemyId || null
                };
            }

            function addCollider(mesh, radius) {
                colliders.push({
                    object: mesh,
                    radius: radius
                });
            }

            function spawnBulletHole(position, normal) {
                bulletHoleSpawner.position.copy(position);
                bulletHoleSpawner.lookAt(
                    position.clone().add(normal)
                );
                bulletHoleSpawner.visible = true;
                setTimeout(() => {
                    bulletHoleSpawner.visible = false;
                }, 2000);
            }

            return {
                init: init,
                _getScene: function() { return scene; },
                _getCamera: function() { return camera; },
                _getRenderer: function() { return renderer; },
                _getControls: function() { return controls; },
                onFrame: function(cb) {
                    frameCallbacks.push(cb);
                },
                getBulletHoleSpawner: function() {
                    return bulletHoleSpawner;
                },
                player: {
                    position: function() {
                        return player.position;
                    },
                    forward: function() {
                        const direction = new THREE.Vector3(0, 0, -1);
                        direction.applyQuaternion(camera.quaternion);
                        return direction;
                    },
                    takeDamage: function(amount) {
                        gameState.health = Math.max(0, gameState.health - amount);
                    },
                    getHealth: function() {
                        return gameState.health;
                    },
                    isSliding: function() {
                        return gameState.isSliding;
                    },
                    getSpeed: function() {
                        return gameState.speed;
                    }
                },
                arena: arena,
                pickup: {
                    spawn: function(type, pos, amount) {
                        // Placeholder for pickup spawning
                    },
                    registerHandler: function(type, handler) {
                        pickupHandlers[type] = handler;
                    }
                },
                gib: function(pos, count, color) {
                    // Create particle effects for gibs
                },
                raycast: raycast,
                addCollider: addCollider
            };
        })();

        // Combat AI Module
        window.CombatApi = (function() {
            let enemies = [];
            let currentWave = 1;
            let waveState = 'intermission';
            let gameStarted = false;
            let callbacks = {
                waveChange: [],
                enemyDeath: [],
                playerHit: [],
                weaponFire: [],
                switch: [],
                pickupCollected: [],
                gameOver: [],
                enemyKillEvent: []
            };
            let weaponInfo = [
                { name: "Pistol", ammo: 30, ammoMax: 30, spread: 0.02, isPlasma: false },
                { name: "Shotgun", ammo: 8, ammoMax: 8, spread: 0.1, isPlasma: false },
                { name: "Plasma Rifle", ammo: 100, ammoMax: 100, spread: 0.01, isPlasma: true }
            ];
            let currentSlot = 0;
            let totalKills = 0;

            function startCombat() {
                gameStarted = true;
                waveState = 'active';
                spawnWave(currentWave);
            }

            function spawnWave(wave) {
                waveState = 'active';
                const enemyCount = Math.min(3 + wave, 10);
                
                for (let i = 0; i < enemyCount; i++) {
                    spawnEnemy('zombie', arenaSpawnPoint(wave));
                }

                callbacks.waveChange.forEach(cb => cb(wave, false, enemyCount));
            }

            function arenaSpawnPoint(level) {
                // Simple spawn point logic
                return new THREE.Vector3(
                    (Math.random() - 0.5) * 20,
                    0,
                    (Math.random() - 0.5) * 20
                );
            }

            function spawnEnemy(type, pos) {
                const scene = window.EngineCore._getScene();
                const enemy = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.5, 1, 4, 8),
                    new THREE.MeshStandardMaterial({ color: 0xff0000 })
                );
                enemy.position.copy(pos);
                enemy.userData = {
                    type: type,
                    isPlayer: false,
                    enemyId: Math.random().toString(36).substring(2, 9),
                    health: type === 'zombie' ? 100 : 200
                };
                enemy.castShadow = true;
                enemy.receiveShadow = true;
                window.EngineCore.addCollider(enemy, 0.5);
                scene.add(enemy);
                enemies.push(enemy);
                return enemy.userData.enemyId;
            }

            function getEnemies() {
                return enemies;
            }

            function setWaveState(state) {
                waveState = state;
            }

            function incrementWave() {
                currentWave++;
                waveState = 'intermission';
                setTimeout(() => {
                    spawnWave(currentWave);
                }, 3000);
            }

            function handleEnemyDeath(id, pos) {
                // Remove enemy from list
                enemies = enemies.filter(enemy => {
                    return enemy.userData.enemyId !== id;
                });
                
                // Check if all enemies are dead
                if (enemies.length === 0 && waveState === 'active') {
                    incrementWave();
                }
                
                totalKills++;
                callbacks.enemyDeath.forEach(cb => cb(id, pos));
            }

            function handleWeaponFire(shotNum) {
                callbacks.weaponFire.forEach(cb => cb(shotNum));
            }

            function handleSwitch(slotIndex) {
                currentSlot = slotIndex;
                callbacks.switch.forEach(cb => cb(slotIndex));
            }

            return {
                startCombat: startCombat,
                handleEnemyDeath: handleEnemyDeath,
                handleWeaponFire: handleWeaponFire,
                handleSwitch: handleSwitch,
                setSlot: handleSwitch,
                wave: {
                    current: function() { return currentWave; },
                    state: function() { return waveState; }
                },
                onWaveChange: function(cb) {
                    callbacks.waveChange.push(cb);
                },
                getEnemies: getEnemies,
                onEnemyDeath: function(cb) {
                    callbacks.enemyDeath.push(cb);
                },
                onPlayerHit: function(cb) {
                    callbacks.playerHit.push(cb);
                },
                weapon: {
                    info: function() { return weaponInfo; }
                },
                onWeaponFire: function(cb) {
                    callbacks.weaponFire.push(cb);
                },
                onSwitch: function(cb) {
                    callbacks.switch.push(cb);
                },
                onPickupCollected: function(cb) {
                    callbacks.pickupCollected.push(cb);
                },
                gameOver: function(cb) {
                    callbacks.gameOver.push(cb);
                },
                onEnemyKillEvent: function(cb) {
                    callbacks.enemyKillEvent.push(cb);
                }
            };
        })();

        // FX/HUD/Audio Module
        window.HudFx = (function() {
            const healthBar = document.getElementById('healthFill');
            const ammoDisplay = document.getElementById('ammo');
            const waveDisplay = document.getElementById('waveDisplay');
            const crosshair = document.getElementById('crosshair');
            const toast = document.getElementById('toast');
            const vignetteEl = document.getElementById('vignette');
            const menu = document.getElementById('menu');
            const startButton = document.getElementById('startButton');

            // Initialize HUD
            function boot() {
                showMenu('title', {});
                
                startButton.addEventListener('click', function() {
                    window.EngineCore.onFrame(gameLoop);
                    showMenu('none');
                    document.body.requestPointerLock();
                });

                // Setup key listeners for weapon swapping
                document.addEventListener('keydown', function(e) {
                    if (e.key === '1') handleWeaponSwitch(0);
                    if (e.key === '2') handleWeaponSwitch(1);
                    if (e.key === '3') handleWeaponSwitch(2);
                });
            }

            function setCrosshair(spreadPct) {
                crosshair.style.width = (20 + spreadPct * 30) + 'px';
                crosshair.style.height = (20 + spreadPct * 30) + 'px';
            }

            function setHealth(pct) {
                healthBar.style.width = (pct * 100) + '%';
            }

            function setAmmo(slot, name, cur, max) {
                ammoDisplay.textContent = name + ': ' + cur + '/' + max;
            }

            function setActiveSlot(i) {
                // Visual feedback for active slot
                const slots = document.querySelectorAll('#ammo');
                slots.forEach((slot, index) => {
                    slot.style.border = index === i ? '2px solid yellow' : 'none';
                });
            }

            function damageFlash(intensity) {
                const flash = document.createElement('div');
                flash.style.position = 'absolute';
                flash.style.top = '0';
                flash.style.left = '0';
                flash.style.width = '100%';
                flash.style.height = '100%';
                flash.style.background = 'rgba(255, 0, 0, 0.3)';
                flash.style.pointerEvents = 'none';
                flash.style.zIndex = '5';
                document.body.appendChild(flash);
                
                setTimeout(() => {
                    document.body.removeChild(flash);
                }, 100);
            }

            function vignette(pct) {
                vignetteEl.style.opacity = pct;
            }

            function showWave(wave, isBoss) {
                waveDisplay.textContent = 'Wave: ' + wave + (isBoss ? ' (BOSS)' : '');
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2000);
            }

            function killConfirm() {
                showToast('KILL!');
            }

            function showMenu(type, stats) {
                menu.style.display = type === 'none' ? 'none' : 'flex';
                if (type === 'gameover') {
                    menu.innerHTML = `
                        <h1>GAME OVER</h1>
                        <p>Final Wave: ${stats.wave || 0}</p>
                        <button id="restartButton">PLAY AGAIN</button>
                    `;
                    document.getElementById('restartButton').addEventListener('click', function() {
                        location.reload();
                    });
                }
            }

            function sfx(name, opts) {
                // Placeholder for sound effects
            }

            function music() {
                return {
                    start: function() {},
                    stop: function() {},
                    intensity: function(pct) {}
                };
            }

            function best() {
                return { bestWave: 5, runs: 3 };
            }

            function saveRun(wave) {
                // Save run data
            }

            return {
                boot: boot,
                setCrosshair: setCrosshair,
                setHealth: setHealth,
                setAmmo: setAmmo,
                setActiveSlot: setActiveSlot,
                damageFlash: damageFlash,
                vignette: vignette,
                showWave: showWave,
                showToast: showToast,
                killConfirm: killConfirm,
                showMenu: showMenu,
                sfx: sfx,
                music: music,
                best: best,
                saveRun: saveRun
            };
        })();

        // Module wiring and game initialization
        window.addEventListener('load', function() {
            const gameContainer = document.getElementById('gameContainer');
            window.EngineCore.init(gameContainer);

            const keys = {};
            document.addEventListener('keydown', function(e) {
                keys[e.code] = true;
                if (['Digit1','Digit2','Digit3'].includes(e.code) && document.pointerLockElement) {
                    handleWeaponSwitch(parseInt(e.code.slice(-1)) - 1);
                }
            });
            document.addEventListener('keyup', function(e) { keys[e.code] = false; });

            let playerDead = false;
            document.addEventListener('mousedown', function(e) {
                if (!document.pointerLockElement) return;
                if (e.button === 0) shoot();
            });

            function shoot() {
                const cam = window.EngineCore._getCamera();
                const hit = window.EngineCore.raycast(cam.position, window.EngineCore.player.forward(), 100);
                window.CombatApi.handleWeaponFire(1);
                if (hit && hit.enemyId) {
                    const enemies = window.CombatApi.getEnemies();
                    const target = enemies.find(en => en.userData.enemyId === hit.enemyId);
                    if (target) {
                        target.userData.health -= 34;
                        if (target.userData.health <= 0) {
                            window.CombatApi.handleEnemyDeath(hit.enemyId, hit.point);
                            sceneRemoveMesh(target);
                        }
                    }
                }
            }

            function sceneRemoveMesh(mesh) {
                const scene = window.EngineCore._getScene();
                scene.remove(mesh);
            }

            let moveVel = new THREE.Vector3();
            window.EngineCore.onFrame(function(delta) {
                const controls = window.EngineCore._getControls();
                if (!controls || !document.pointerLockElement) return;
                const obj = controls.getObject();
                const cam = window.EngineCore._getCamera();
                const speed = window.EngineCore.player.isSliding() ? 14 : 6;
                const dir = new THREE.Vector3();
                if (keys['KeyW'] || keys['ArrowUp']) dir.z -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) dir.z += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dir.x -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) dir.x += 1;
                if (dir.lengthSq() > 0) {
                    const yaw = Math.atan2(cam.getWorldDirection(new THREE.Vector3()).x,
                                           cam.getWorldDirection(new THREE.Vector3()).z);
                    dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(speed * delta);
                }
                moveVel.lerp(dir, 0.2);
                obj.position.add(moveVel);
                obj.position.x = Math.max(-24, Math.min(24, obj.position.x));
                obj.position.z = Math.max(-24, Math.min(24, obj.position.z));

                // enemies chase the player
                const scene = window.EngineCore._getScene();
                window.CombatApi.getEnemies().forEach(function(en) {
                    const toPlayer = cam.position.clone().sub(en.position); toPlayer.y = 0;
                    const dist = toPlayer.length();
                    if (dist > 1.5) {
                        en.position.add(toPlayer.normalize().multiplyScalar(2.2 * delta));
                    } else if (!playerDead) {
                        window.EngineCore.player.takeDamage(10 * delta * 3);
                        window.HudFx.setHealth(Math.max(0, window.EngineCore.player.getHealth()) / 100);
                        window.HudFx.damageFlash(0.3);
                        if (window.EngineCore.player.getHealth() <= 0) {
                            playerDead = true;
                            window.HudFx.showMenu('gameover', { wave: window.CombatApi.wave.current() });
                            document.exitPointerLock();
                        }
                    }
                });
            });

            // Wire up Engine Core to Combat AI
            window.EngineCore.onFrame(function(delta) {
                if (window.CombatApi.wave.state() === 'active' && window.CombatApi.wave.current() > 0) {
                    // combat AI updates handled above
                }
            });

            // Wire up Combat API to HUD/FX
            window.CombatApi.onWaveChange(function(wave, isBoss, enemyCount) {
                window.HudFx.showWave(wave, isBoss);
            });

            window.CombatApi.onPlayerHit(function(amount) {
                window.HudFx.setHealth(window.EngineCore.player.getHealth() / 100);
                window.HudFx.damageFlash(amount / 100);
            });

            window.CombatApi.onWeaponFire(function(shotNum) {
                window.HudFx.setCrosshair(0.1);
            });

            window.CombatApi.onEnemyDeath(function(id, pos) {
                window.HudFx.killConfirm();
            });

            window.CombatApi.onPickupCollected(function(type, newAmount) {
                // Handle pickup events
            });

            // Start the game
            window.HudFx.boot();
        });

        // Game mechanics (combined from all modules)
        let scene = null;
        let camera = null;
        let renderer = null;
        let controls = null;
        let clock = new THREE.Clock();

        // Handle game loop
        function gameLoop(delta) {
            // Update player movement based on input
            const player = window.EngineCore.player;
            const speed = player.getSpeed();
            
            // Update HUD elements
            window.HudFx.setHealth(player.getHealth() / 100);
            window.HudFx.setAmmo(0, "Pistol", 30, 30);
            window.HudFx.setActiveSlot(0);
            
            // Update wave display
            if (window.CombatApi) {
                window.HudFx.showWave(window.CombatApi.wave.current(), false);
            }
            
            // Handle weapon shooting if needed
            const weaponInfo = window.CombatApi.weapon.info();
            if (weaponInfo.length > 0) {
                window.HudFx.setAmmo(0, weaponInfo[0].name, 30, 30);
            }
        }

        // Floor, arena walls, and lighting build-out (merged glue)
        function buildArena() {
            const scene = window.EngineCore._getScene();
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(50, 50),
                new THREE.MeshStandardMaterial({ color: 0x333a44 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x223040 });
            const dims = [[50, 1, 50], [50, 1, -50], [0, 1, 50], [0, 1, -50]];
            dims.forEach(function(d, i) {
                const w = new THREE.Mesh(new THREE.BoxGeometry(i < 2 ? 50 : 1, 4, i < 2 ? 1 : 50), wallMat);
                w.position.set(d[0], 2, d[2]);
                w.castShadow = true;
                scene.add(w);
                window.EngineCore.addCollider(w, 1);
            });
            for (let i = 0; i < 6; i++) {
                const crate = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 1.5, 1.5),
                    new THREE.MeshStandardMaterial({ color: 0x51606f })
                );
                crate.position.set((Math.random() - 0.5) * 40, 0.75, (Math.random() - 0.5) * 40);
                crate.castShadow = true;
                scene.add(crate);
                window.EngineCore.addCollider(crate, 0.8);
            }
        }

        // Handle weapon switch
        function handleWeaponSwitch(slot) {
            if (window.CombatApi.setSlot) window.CombatApi.setSlot(slot);
            window.CombatApi.handleSwitch(slot);
            window.HudFx.setActiveSlot(slot);
        }

        // Patch START button behavior: build arena, start combat, lock pointer
        (function patchStart() {
            window.addEventListener('load', function() {
                const startButton = document.getElementById('startButton');
                if (!startButton) return;
                const clone = startButton.cloneNode(true);
                startButton.parentNode.replaceChild(clone, startButton);
                clone.addEventListener('click', function() {
                    window.HudFx.showMenu('none');
                    window.EngineCore.onFrame(gameLoop);
                    buildArena();
                    window.CombatApi.startCombat();
                    document.body.requestPointerLock();
                });
            });
        })();
    </script>
</body>
</html>
